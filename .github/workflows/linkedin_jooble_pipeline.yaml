# Pipeline LinkedIn/Jooble: in produzione lo schedule è sul cluster (CronJob Helm),
# perché RDS non è raggiungibile da GitHub-hosted runners (timeout rete).
#
# Questo workflow resta disponibile solo per test manuali (workflow_dispatch),
# ad esempio se DATABASE_URL punta a un MySQL pubblicamente raggiungibile.
#
# Secrets: DATABASE_URL, OPENAI_API_KEY (solo per run manuale da qui).

name: LinkedIn Jooble job feed pipeline

on:
  workflow_dispatch:

concurrency:
  group: linkedin-jooble-pipeline
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh job_posting_pre and improve descriptions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/run_linkedin_jooble_pipeline.py
