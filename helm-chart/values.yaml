autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# API pod: large XML feeds (/wrapping, /wrapping/jooble) load all rows in memory.
# Previous 512Mi caused OOM with tens of thousands of jobs; tune with ALB timeouts.
resources:
  limits:
    cpu: "1"
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 512Mi

image: 343417272737.dkr.ecr.eu-central-1.amazonaws.com/linkedin-wrapping-service

database:
  DATABASE_URL: ""

# Esegue nella VPC del cluster (RDS raggiungibile). Creare il secret OpenAI nel namespace:
# kubectl create secret generic openai-api-key --from-literal=OPENAI_API_KEY=sk-... -n lw
jobFeedPipeline:
  enabled: false
  suspend: false
  schedule: "0 4,13 * * *"
  activeDeadlineSeconds: 7200
  openaiSecretName: openai-api-key
  openaiSecretKey: OPENAI_API_KEY
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi


ingress:
  enabled: true
  host: lw.joinrs.com
  certificateArn: "arn:aws:acm:eu-central-1:343417272737:certificate/7e1a8968-bab3-4d30-a6f1-7b14a20b576a"
  group:
    name: ""  # Optional: ALB ingress group name for sharing ALB across ingresses
  # ALB idle timeout (seconds). Default 60s often 502s large XML; 300 = 5 minutes.
  albLoadBalancerAttributes: "idle_timeout.timeout_seconds=300"

